<!DOCTYPE html>
<html>
<head>
<title>Real Estate Tableau Dashboard</title>

<style>
body{
font-family: Arial;
background:#f5f5f5;
text-align:center;
margin:0;
}

.header{
background:#222;
color:white;
padding:20px;
}

.container{
width:90%;
margin:auto;
margin-top:30px;
}
</style>

</head>

<body>

<div class="header">
<h1>Real Estate Data Analysis Dashboard</h1>
<p>Interactive Tableau Visualization</p>
</div>

<div class="container">

<div class='tableauPlaceholder' id='vizDashboard' style='position: relative'>
<noscript>
<a href='#'>
<img alt='Dashboard'
src='https://public.tableau.com/static/images/Bo/Book4_17729306287170/Dashboard1/1_rss.png'
style='border:none'/>
</a>
</noscript>

<object class='tableauViz' style='display:none;'>

<param name='host_url' value='https://public.tableau.com/' />
<param name='embed_code_version' value='3' />
<param name='site_root' value='' />
<param name='name' value='Book4_17729306287170/Dashboard1' />
<param name='tabs' value='no' />
<param name='toolbar' value='yes' />

</object>
</div>

</div>

<script type='text/javascript'>

var divElement = document.getElementById('vizDashboard');
var vizElement = divElement.getElementsByTagName('object')[0];

vizElement.style.width='100%';
vizElement.style.height='600px';

var scriptElement = document.createElement('script');
scriptElement.src='https://public.tableau.com/javascripts/api/viz_v1.js';

vizElement.parentNode.insertBefore(scriptElement, vizElement);

</script>

</body>
</html>
